<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Counter</title>
<style>
  :root {
    --bg: #f6f5f1;
    --text: #1d1d1b;
    --c15: #e4572e;
    --c5: #2e86ab;
    --circle-text: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --text: #f2f0ea; --c15: #f06a42; --c5: #48a3c9; }
  }
  :root[data-theme="dark"] { --bg: #161615; --text: #f2f0ea; --c15: #f06a42; --c5: #48a3c9; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6vh; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #total {
    font-size: 11rem;
    font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform .12s ease;
  }
  #total.pop { transform: scale(1.1); }
  .row { display: flex; gap: 20px; position: absolute; flex-direction: column; right: 50px; bottom: 50px;}
  .wrap { position: relative; width: 100px; aspect-ratio: 1; }
  button.circle {
    position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%;
    border: none; cursor: pointer; color: var(--circle-text);
    font-size: 45px; font-weight: 700;
    transition: transform .08s ease;
  }
  button.circle:active { transform: scale(.88); }
  .ring {
    position: absolute; inset: 0; z-index: 0; border-radius: 50%;
    border: 5px solid var(--ring); box-sizing: border-box; pointer-events: none;
    animation: ring .55s ease-out forwards;
  }
  @keyframes ring {
    from { transform: scale(1); opacity: .9; }
    to   { transform: scale(1.9); opacity: 0; }
  }
  #b15 { background: var(--c15); }
  #b5 { background: var(--c5); }
</style>
</head>
<body>
  <div id="total">0</div>
  <div class="row">
    <div class="wrap" style="--ring: var(--c15)"><button class="circle" id="b15" data-add="15">15</button></div>
    <div class="wrap" style="--ring: var(--c5)"><button class="circle" id="b5" data-add="5">5</button></div>
  </div>
<script>
  let total = 0;
  const el = document.getElementById('total');
  document.querySelectorAll('button.circle').forEach(b => {
    b.addEventListener('click', () => {
      const ring = document.createElement('span');
      ring.className = 'ring';
      ring.addEventListener('animationend', () => ring.remove());
      b.parentElement.insertBefore(ring, b);
      b.animate([{ transform: 'scale(.82)' }, { transform: 'scale(1)' }],
                { duration: 250, easing: 'cubic-bezier(.3,1.6,.5,1)' });
      total += Number(b.dataset.add);
      el.textContent = total;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 120);
    });
  });
</script>
</body>
</html>
